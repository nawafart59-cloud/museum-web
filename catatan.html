<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Kita</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Quicksand & Caveat -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SDK Firebase CDN (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- DOMPurify (Pengaman dari serangan XSS/Script berbahaya) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff7f8;
            color: #374151;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #f43f5e; border-radius: 10px; }
        
        [contenteditable]:empty:before {
            content: attr(placeholder);
            color: #9ca3af;
            pointer-events: none;
            display: block;
        }

        .font-handwriting {
            font-family: 'Quicksand', sans-serif;
        }

        /* STYLING JUDUL DI KOTAK SAMPUL */
        .note-card h3,
        .note-card .cover-title {
            font-size: 0.95rem !important;
            line-height: 1.35 !important;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
        }

        /* TEMA: BUKU TULIS / AESTHETIC JOURNAL */
        body.theme-journal {
            background-color: #f7f3ed !important;
            color: #2d2a26 !important;
        }
        body.theme-journal #header-card {
            background-color: rgba(255, 255, 255, 0.9) !important;
            border-color: #e6dfd5 !important;
        }
        body.theme-journal #header-title {
            background: none !important;
            -webkit-text-fill-color: initial !important;
            color: #5c4033 !important;
        }
        body.theme-journal #read-screen,
        body.theme-journal #form-screen {
            background-color: #f7f3ed !important;
        }
        
        body.theme-journal .notebook-paper {
            background-color: #fffdf9 !important;
            background-image: 
                linear-gradient(#e8e2d5 1px, transparent 1px),
                linear-gradient(90deg, #f43f5e 2px, transparent 2px) !important;
            background-size: 100% 2.4rem, 100% 100% !important;
            background-position: 0 0.6rem, 0.9rem 0 !important; 
            padding-left: 2rem !important; 
            padding-right: 1.2rem !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04) !important;
            border-color: #e6dfd5 !important;
        }

        body.theme-journal .font-handwriting {
            font-family: 'Caveat', cursive !important;
            font-size: 1.5rem !important;
            line-height: 2.4rem !important;
            color: #1c1917;
        }
        
        body.theme-journal .bg-primary-btn {
            background-color: #735745 !important;
            color: #ffffff !important;
            border: none !important;
        }

        /* TEMA: MODE SIMPLE ELEGANT */
        body.theme-elegant {
            background-color: #fafafa !important;
            color: #18181b !important;
        }
        body.theme-elegant .bg-white {
            background-color: #ffffff !important;
            color: #18181b !important;
        }
        body.theme-elegant #header-card {
            background-color: rgba(255, 255, 255, 0.85) !important;
            border-color: #e4e4e7 !important;
        }
        body.theme-elegant #header-title {
            background: none !important;
            -webkit-text-fill-color: initial !important;
            color: #18181b !important;
        }
        body.theme-elegant #read-screen,
        body.theme-elegant #form-screen {
            background-color: #fafafa !important;
        }
        body.theme-elegant .bg-primary-btn {
            background-color: #18181b !important;
            color: #ffffff !important;
        }

        .gradient-swatch {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            border: 2px solid transparent;
            flex-shrink: 0;
        }
        .gradient-swatch.selected {
            transform: scale(1.15);
            border-color: #f43f5e;
            box-shadow: 0 0 8px rgba(244, 63, 94, 0.4);
        }

        /* Style Foto di dalam editor/bacaan */
        .inline-photo-wrapper img {
            max-height: 320px;
            object-fit: contain;
            cursor: pointer;
        }
    </style>
</head>
<body class="relative overflow-x-hidden pb-12">

    <!-- HALAMAN UTAMA -->
    <div id="main-screen" class="max-w-6xl mx-auto px-4 sm:px-8 pt-6 pb-20 relative z-10">
        
        <!-- HEADER -->
        <div id="header-card" class="mb-5 p-4 rounded-2xl bg-white/80 backdrop-blur-md border border-rose-100 shadow-xs flex justify-between items-center transition-all">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-rose-50 border border-rose-100 flex items-center justify-center text-rose-500 shadow-2xs">
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <div>
                    <h1 id="header-title" class="text-lg font-bold text-gray-800 tracking-tight flex items-center gap-1.5">
                        Catatan Kita
                    </h1>
                    <p class="text-rose-400 text-xs font-medium">Jurnal & Kenangan Indah</p>
                </div>
            </div>
            
            <button id="theme-btn" onclick="toggleTheme()" class="px-3.5 py-2 rounded-xl bg-white border border-rose-100 text-xs font-semibold text-rose-700 shadow-2xs flex items-center gap-1.5 hover:bg-rose-50 transition active:scale-95">
                <svg class="w-4 h-4 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/></svg>
                <span>Romantis</span>
            </button>
        </div>

        <!-- Kolom Pencarian -->
        <div class="mb-5 relative">
            <input type="text" id="search-input" oninput="filterNotes()" placeholder="Cari memori, judul, atau penulis..." class="w-full pl-10 pr-4 py-3 rounded-xl border border-rose-100 shadow-2xs bg-white/90 text-xs text-gray-700 focus:outline-none focus:border-rose-300 transition">
            <span class="absolute left-3.5 top-3.5 text-rose-400 select-none">
                <svg class="w-4 h-4 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </span>
        </div>

        <!-- Grid Catatan -->
        <div id="notes-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- Dimuat Realtime -->
        </div>
    </div>

    <!-- LAYAR BACA FULLSCREEN -->
    <div id="read-screen" class="fixed inset-0 bg-[#fff7f8] z-40 hidden flex-col px-4 sm:px-8 pt-4 pb-6 overflow-y-auto">
        <div class="max-w-6xl mx-auto w-full flex-grow flex flex-col">
            <div class="flex justify-between items-center mb-4 px-1">
                <button onclick="closeReadScreen()" class="bg-white text-rose-600 px-4 py-2 rounded-xl shadow-2xs font-semibold text-xs border border-rose-100 active:scale-95 transition flex items-center gap-2">
                    <svg class="w-4 h-4 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
                    <span>Kembali</span>
                </button>
                <div class="flex gap-2">
                    <button id="btn-edit" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-xl shadow-2xs font-semibold text-xs transition active:scale-95 flex items-center gap-1.5 bg-primary-btn">
                        <svg class="w-4 h-4 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"/></svg>
                        <span>Edit</span>
                    </button>
                    <button id="btn-delete" class="bg-red-100 hover:bg-red-200 text-red-600 px-3.5 py-2 rounded-xl font-semibold text-xs transition active:scale-95 flex items-center gap-1.5">
                        <svg class="w-4 h-4 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
                    </button>
                </div>
            </div>

            <div id="read-paper-card" class="bg-white rounded-2xl p-5 sm:p-8 shadow-2xs border border-rose-100 flex-grow notebook-paper transition-all">
                <div class="flex flex-wrap items-center gap-2 mb-4 border-b border-rose-100/60 pb-3">
                    <span id="read-title" class="text-base font-bold text-gray-800"></span>
                    <span id="read-author" class="text-xs font-semibold text-rose-700 bg-rose-50 border border-rose-100 px-2.5 py-0.5 rounded-lg"></span>
                    <span id="read-created-at" class="text-[11px] font-medium text-gray-400 bg-gray-50 border border-gray-100 px-2.5 py-0.5 rounded-lg ml-auto"></span>
                </div>
                
                <div id="read-content" class="text-gray-900 leading-relaxed text-sm space-y-2 font-handwriting"></div>
            </div>
        </div>
    </div>

    <!-- LAYAR FORM TAMBAH / EDIT -->
    <div id="form-screen" class="fixed inset-0 bg-[#fff7f8] z-40 hidden flex-col px-4 sm:px-8 pt-3 pb-4 overflow-y-auto">
        <div class="max-w-6xl mx-auto w-full flex-grow flex flex-col relative">
            
            <form id="note-form" class="flex flex-col flex-grow gap-3">
                
                <!-- STICKY HEADER NAVIGASI FORM -->
                <div class="sticky top-0 z-30 bg-[#fff7f8]/95 backdrop-blur-md py-2.5 px-1 border-b border-rose-100 flex justify-between items-center gap-2">
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="closeForm()" title="Kembali" class="px-3 py-1.5 rounded-xl bg-white border border-rose-100 text-gray-700 hover:bg-gray-50 transition active:scale-95 shadow-2xs flex items-center gap-1.5 text-xs font-semibold">
                            <svg class="w-4 h-4 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
                            <span class="hidden sm:inline">Kembali</span>
                        </button>
                        <div class="h-5 w-px bg-rose-200 mx-0.5"></div>
                        <button type="button" onmousedown="event.preventDefault(); applyFormat('undo');" title="Urungkan (Undo)" class="p-2 rounded-xl bg-white border border-rose-100 text-rose-600 hover:bg-rose-50 transition active:scale-95 shadow-2xs flex items-center justify-center">
                            <svg class="w-4 h-4 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3"/></svg>
                        </button>
                        <button type="button" onmousedown="event.preventDefault(); applyFormat('redo');" title="Ulangi (Redo)" class="p-2 rounded-xl bg-white border border-rose-100 text-rose-600 hover:bg-rose-50 transition active:scale-95 shadow-2xs flex items-center justify-center">
                            <svg class="w-4 h-4 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 15l6-6m0 0l-6-6m6 6H9a6 6 0 000 12h3"/></svg>
                        </button>
                    </div>

                    <h2 id="form-title" class="text-sm font-bold text-gray-800 hidden md:block">
                        Tulis Catatan
                    </h2>

                    <!-- TOMBOL SIMPAN -->
                    <button type="submit" id="btn-save" title="Simpan Catatan" class="bg-rose-500 hover:bg-rose-600 text-white p-2.5 rounded-xl shadow-2xs transition active:scale-95 flex items-center justify-center bg-primary-btn">
                        <svg class="w-5 h-5 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 21H7a2 2 0 01-2-2V5a2 2 0 012-2h8l4 4v12a2 2 0 01-2 2z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M7 3v5h8V3M7 21v-8h10v8" />
                        </svg>
                    </button>
                </div>

                <!-- Input Judul & Penulis -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">Judul Catatan:</label>
                        <input type="text" id="note-date" maxlength="60" placeholder="Judul / Momen (Cth: Date di Cafe Sweet)" class="w-full px-3.5 py-2.5 rounded-xl border border-rose-100 shadow-2xs bg-white focus:outline-none text-xs font-medium text-gray-700">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">Ditulis Oleh:</label>
                        <input type="text" id="note-author" maxlength="30" placeholder="Nama Penulis (Cth: Kevin)" class="w-full px-3.5 py-2.5 rounded-xl border border-rose-100 shadow-2xs bg-white focus:outline-none text-xs font-medium text-gray-700">
                    </div>
                </div>

                <!-- Pilihan Warna Gradasi & Warna Tulisan Judul -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <!-- Gradasi Sampul -->
                    <div class="bg-white p-3 rounded-xl border border-rose-100 shadow-2xs">
                        <label class="block text-[11px] font-semibold text-gray-600 mb-2">Pilih Gradasi Sampul:</label>
                        <div class="flex items-center gap-2.5 overflow-x-auto pb-1" id="gradient-picker">
                            <!-- Swatch disuntikkan via JS -->
                        </div>
                    </div>

                    <!-- Warna Tulisan Judul -->
                    <div class="bg-white p-3 rounded-xl border border-rose-100 shadow-2xs">
                        <label class="block text-[11px] font-semibold text-gray-600 mb-2">Pilih Warna Tulisan Judul:</label>
                        <div class="flex items-center gap-2.5 overflow-x-auto pb-1" id="title-color-picker">
                            <!-- Swatch disuntikkan via JS -->
                        </div>
                    </div>
                </div>

                <!-- STICKY TOOLBAR FORMAT TEKS -->
                <div class="sticky top-[58px] z-20 flex flex-wrap items-center gap-1.5 bg-white/95 backdrop-blur-md p-2 rounded-xl border border-rose-100 shadow-2xs">
                    <div class="flex items-center gap-1">
                        <button type="button" onmousedown="event.preventDefault(); applyFormat('bold');" title="Tebal" class="w-7 h-7 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-xs flex items-center justify-center transition">B</button>
                        <button type="button" onmousedown="event.preventDefault(); applyFormat('italic');" title="Miring" class="w-7 h-7 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 italic text-xs flex items-center justify-center transition">I</button>
                        <button type="button" onmousedown="event.preventDefault(); applyFormat('underline');" title="Garis Bawah" class="w-7 h-7 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 underline text-xs flex items-center justify-center transition">U</button>
                    </div>

                    <div class="h-4 w-px bg-rose-100 mx-0.5"></div>

                    <!-- Alignment -->
                    <div class="flex items-center gap-1">
                        <button type="button" onmousedown="event.preventDefault(); applyFormat('justifyLeft');" title="Rata Kiri" class="w-7 h-7 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 flex items-center justify-center transition">
                            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M3 4h18v2H3V4zm0 5h12v2H3V9zm0 5h18v2H3v-2zm0 5h12v2H3v-2z"/></svg>
                        </button>
                        <button type="button" onmousedown="event.preventDefault(); applyFormat('justifyCenter');" title="Rata Tengah" class="w-7 h-7 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 flex items-center justify-center transition">
                            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M3 4h18v2H3V4zm3 5h12v2H6V9zm-3 5h18v2H3v-2zm3 5h12v2H6v-2z"/></svg>
                        </button>
                        <button type="button" onmousedown="event.preventDefault(); applyFormat('justifyRight');" title="Rata Kanan" class="w-7 h-7 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 flex items-center justify-center transition">
                            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M3 4h18v2H3V4zm6 5h12v2H9V9zm-6 5h18v2H3v-2zm6 5h12v2H9v-2z"/></svg>
                        </button>
                        <button type="button" onmousedown="event.preventDefault(); applyFormat('justifyFull');" title="Rata Kanan Kiri" class="w-7 h-7 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 flex items-center justify-center transition">
                            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M3 4h18v2H3V4zm0 5h18v2H3V9zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
                        </button>
                    </div>

                    <div class="h-4 w-px bg-rose-100 mx-0.5"></div>

                    <!-- Warna Teks Editor -->
                    <div class="flex items-center gap-1.5 overflow-x-auto py-0.5">
                        <button type="button" onmousedown="event.preventDefault(); applyFormat('foreColor', '#1c1917');" class="w-4 h-4 rounded-full bg-stone-900 hover:scale-110 transition shadow-2xs" title="Hitam"></button>
                        <button type="button" onmousedown="event.preventDefault(); applyFormat('foreColor', '#e11d48');" class="w-4 h-4 rounded-full bg-rose-600 hover:scale-110 transition shadow-2xs" title="Rose"></button>
                        <button type="button" onmousedown="event.preventDefault(); applyFormat('foreColor', '#db2777');" class="w-4 h-4 rounded-full bg-pink-600 hover:scale-110 transition shadow-2xs" title="Magenta"></button>
                        <button type="button" onmousedown="event.preventDefault(); applyFormat('foreColor', '#9333ea');" class="w-4 h-4 rounded-full bg-purple-600 hover:scale-110 transition shadow-2xs" title="Ungu"></button>
                        <button type="button" onmousedown="event.preventDefault(); applyFormat('foreColor', '#2563eb');" class="w-4 h-4 rounded-full bg-blue-600 hover:scale-110 transition shadow-2xs" title="Biru"></button>
                        <button type="button" onmousedown="event.preventDefault(); applyFormat('foreColor', '#059669');" class="w-4 h-4 rounded-full bg-emerald-600 hover:scale-110 transition shadow-2xs" title="Hijau"></button>
                    </div>
                </div>

                <!-- Editor Catatan -->
                <div id="editor-paper-card" class="relative flex-grow min-h-[360px] bg-white rounded-2xl border border-rose-100 shadow-2xs p-4 sm:p-6 flex flex-col gap-3 notebook-paper transition-all mb-12">
                    <div id="editor" contenteditable="true" placeholder="Tulis cerita manis kalian di sini... Letakkan kursor di posisi yang kamu inginkan lalu tekan tombol foto melayang di kanan bawah." class="w-full min-h-[220px] focus:outline-none text-gray-900 text-sm leading-relaxed font-handwriting"></div>
                    <div id="photo-loading-status"></div>
                </div>

                <!-- Tombol Upload Foto Melayang (Posisikan Foto di Kursor) -->
                <div class="fixed bottom-6 right-6 z-50">
                    <label for="note-image" title="Sisipkan Foto di Kursor" class="w-12 h-12 bg-rose-500 hover:bg-rose-600 active:scale-95 text-white rounded-full shadow-lg flex items-center justify-center cursor-pointer transition bg-primary-btn border-2 border-white">
                        <svg class="w-6 h-6 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z"/></svg>
                    </label>
                    <input type="file" id="note-image" accept="image/jpeg,image/png,image/webp" multiple class="hidden" onchange="handleImageUpload(event)">
                </div>

            </form>
        </div>
    </div>

    <!-- MODAL PREVIEW FOTO PERBESAR -->
    <div id="preview-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex-col items-center justify-center p-4" onclick="closePreviewModal()">
        <button onclick="closePreviewModal()" class="absolute top-5 right-5 text-white bg-white/20 hover:bg-white/40 w-9 h-9 rounded-full flex items-center justify-center font-bold text-base shadow-lg transition">
            <svg class="w-4 h-4 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
        <img id="preview-modal-img" src="" class="max-w-full max-h-[85vh] rounded-xl object-contain shadow-2xl transition-transform" onclick="event.stopPropagation()">
    </div>

    <script>
        // ==========================================
        // KONFIGURASI FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyB59FGVb1ffz__-XK9mQJfAw__y9V2zz9s",
            authDomain: "lovejournal-66238.firebaseapp.com",
            projectId: "lovejournal-66238",
            storageBucket: "lovejournal-66238.firebasestorage.app",
            messagingSenderId: "658057153141",
            appId: "1:658057153141:web:17b12453a13505d85a863c"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        db.enablePersistence().catch((err) => {
            console.warn("Firestore Persistence Warning:", err.code);
        });

        let editingId = null;
        let globalNotes = [];
        let savedRange = null; // MENGINGAT POSISI KURSOR TERAKHIR

        // OPSI WARNA GRADASI SAMPUL
        const coverGradients = [
            { id: 'brown', css: 'linear-gradient(135deg, #3d2b1f, #231710)', label: 'Coklat' },
            { id: 'sunset', css: 'linear-gradient(135deg, #ff7e5f, #feb47b)', label: 'Sunset Coral' },
            { id: 'purple-blue', css: 'linear-gradient(135deg, #6a11cb, #2575fc)', label: 'Purple Ocean' },
            { id: 'emerald', css: 'linear-gradient(135deg, #11998e, #38ef7d)', label: 'Emerald' },
            { id: 'rose-gold', css: 'linear-gradient(135deg, #ff9a9e, #fecfef)', label: 'Rose Gold' },
            { id: 'midnight', css: 'linear-gradient(135deg, #2c3e50, #000000)', label: 'Midnight' },
            { id: 'berry', css: 'linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045)', label: 'Berry' }
        ];

        // OPSI WARNA TULISAN JUDUL
        const titleColors = [
            { id: 'white', code: '#ffffff', label: 'Putih' },
            { id: 'black', code: '#1c1917', label: 'Hitam' },
            { id: 'yellow', code: '#fde047', label: 'Kuning' },
            { id: 'cyan', code: '#a5f3fc', label: 'Biru Muda' },
            { id: 'pink', code: '#fbcfe8', label: 'Pink' },
            { id: 'gold', code: '#f59e0b', label: 'Emas/Oranye' }
        ];

        let selectedCoverGradient = coverGradients[0].css;
        let selectedTitleColor = titleColors[0].code;

        const svgThemeIcon = `<svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/></svg>`;

        // SIMPAN POSISI KURSOR SECARA PERSISTEN
        function saveSelection() {
            const editor = document.getElementById('editor');
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
                const range = sel.getRangeAt(0);
                if (editor.contains(range.commonAncestorContainer)) {
                    savedRange = range.cloneRange();
                }
            }
        }

        function initGradientPicker() {
            const container = document.getElementById('gradient-picker');
            if(!container) return;
            container.innerHTML = '';
            coverGradients.forEach((grad) => {
                const swatch = document.createElement('div');
                swatch.className = `gradient-swatch ${grad.css === selectedCoverGradient ? 'selected' : ''}`;
                swatch.style.background = grad.css;
                swatch.title = grad.label;
                swatch.onclick = () => {
                    document.querySelectorAll('.gradient-swatch').forEach(s => s.classList.remove('selected'));
                    swatch.classList.add('selected');
                    selectedCoverGradient = grad.css;
                };
                container.appendChild(swatch);
            });
        }

        function initTitleColorPicker() {
            const container = document.getElementById('title-color-picker');
            if(!container) return;
            container.innerHTML = '';
            titleColors.forEach((tc) => {
                const swatch = document.createElement('div');
                const isSelected = tc.code.toLowerCase() === selectedTitleColor.toLowerCase();
                swatch.className = `w-7 h-7 rounded-full cursor-pointer transition border border-gray-300 shadow-2xs flex-shrink-0 ${isSelected ? 'ring-2 ring-rose-500 scale-110' : ''}`;
                swatch.style.backgroundColor = tc.code;
                swatch.title = tc.label;
                swatch.onclick = () => {
                    document.querySelectorAll('#title-color-picker div').forEach(s => s.classList.remove('ring-2', 'ring-rose-500', 'scale-110'));
                    swatch.classList.add('ring-2', 'ring-rose-500', 'scale-110');
                    selectedTitleColor = tc.code;
                };
                container.appendChild(swatch);
            });
        }

        function applyTheme(theme) {
            const btn = document.getElementById('theme-btn');
            document.body.classList.remove('theme-elegant', 'theme-journal');

            if (theme === 'journal') {
                document.body.classList.add('theme-journal');
                if (btn) btn.innerHTML = `${svgThemeIcon} <span>Buku Tulis</span>`;
            } else if (theme === 'elegant') {
                document.body.classList.add('theme-elegant');
                if (btn) btn.innerHTML = `${svgThemeIcon} <span>Minimalis</span>`;
            } else {
                if (btn) btn.innerHTML = `${svgThemeIcon} <span>Romantis</span>`;
            }
        }

        function toggleTheme() {
            const currentTheme = localStorage.getItem('journal_theme') || 'romantic';
            let newTheme = 'romantic';

            if (currentTheme === 'romantic') newTheme = 'journal';
            else if (currentTheme === 'journal') newTheme = 'elegant';
            else newTheme = 'romantic';

            localStorage.setItem('journal_theme', newTheme);
            applyTheme(newTheme);
        }

        function loadSavedTheme() {
            const savedTheme = localStorage.getItem('journal_theme') || 'romantic';
            applyTheme(savedTheme);
        }

        function formatCreatedDate(timestamp) {
            if (!timestamp) return 'Baru saja';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleDateString('id-ID', {
                day: 'numeric',
                month: 'short',
                year: 'numeric'
            });
        }

        function applyFormat(command, value = null) {
            document.execCommand(command, false, value);
            saveSelection();
        }

        function openForm(id = null) {
            editingId = id;
            savedRange = null; // Reset ingatan kursor saat buka form baru
            document.getElementById('form-screen').classList.remove('hidden');
            document.getElementById('form-screen').classList.add('flex');
            document.body.style.overflow = 'hidden';

            if (id) {
                document.getElementById('form-title').innerHTML = 'Edit Catatan';
                const note = globalNotes.find(n => n.id === id);
                if (note) {
                    document.getElementById('note-date').value = note.date || '';
                    document.getElementById('note-author').value = note.author || '';
                    document.getElementById('editor').innerHTML = note.content || '';
                    selectedCoverGradient = note.coverGradient || coverGradients[0].css;
                    selectedTitleColor = note.titleColor || titleColors[0].code;
                }
            } else {
                document.getElementById('form-title').innerHTML = 'Tulis Catatan Baru';
                document.getElementById('note-form').reset();
                document.getElementById('editor').innerHTML = '';
                selectedCoverGradient = coverGradients[0].css;
                selectedTitleColor = titleColors[0].code;
            }

            initGradientPicker();
            initTitleColorPicker();
        }

        function closeForm() {
            document.getElementById('form-screen').classList.add('hidden');
            document.getElementById('form-screen').classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 480;
                            let width = img.width;
                            let height = img.height;

                            if (width > MAX_WIDTH) {
                                height = Math.round((height * MAX_WIDTH) / width);
                                width = MAX_WIDTH;
                            }

                            canvas.width = width;
                            canvas.height = height;

                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', 0.5));
                        } catch (err) {
                            resolve(null);
                        }
                    };
                    img.onerror = () => resolve(null);
                    img.src = event.target.result;
                };
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(file);
            });
        }

        async function handleImageUpload(e) {
            const files = Array.from(e.target.files);
            const statusDiv = document.getElementById('photo-loading-status');
            
            if (files.length === 0) return;

            for (let i = 0; i < files.length; i++) {
                statusDiv.innerHTML = `
                    <div class="flex items-center justify-center gap-2 py-1.5 px-3 text-rose-600 bg-rose-50 rounded-xl border border-rose-100 my-1">
                        <svg class="animate-spin h-3.5 w-3.5 text-rose-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span class="text-xs font-semibold">Menyisipkan Foto ${i + 1}/${files.length}...</span>
                    </div>
                `;

                const compressedBase64 = await compressImage(files[i]);
                if (compressedBase64) {
                    insertImageToEditor(compressedBase64);
                }
            }

            statusDiv.innerHTML = '';
            e.target.value = '';
        }

        function insertImageToEditor(src) {
            const editor = document.getElementById('editor');
            
            const imgContainer = document.createElement('div');
            imgContainer.className = 'inline-photo-wrapper my-3 text-center contenteditable-false';
            imgContainer.innerHTML = `<img src="${src}" class="rounded-xl shadow-xs border border-rose-100 max-w-full mx-auto my-1.5 inline-block" />`;

            const sel = window.getSelection();

            // KEMBALIKAN KURSOR KE POSISI TERSIMPAN (JIKA ADA)
            if (savedRange) {
                sel.removeAllRanges();
                sel.addRange(savedRange);
            }

            if (sel.rangeCount > 0) {
                const range = sel.getRangeAt(0);
                if (editor.contains(range.commonAncestorContainer)) {
                    range.deleteContents();
                    range.insertNode(imgContainer);

                    const p = document.createElement('p');
                    p.innerHTML = '<br>';
                    imgContainer.after(p);

                    // Pindahkan kursor persis di bawah foto yang baru di-insert
                    const newRange = document.createRange();
                    newRange.setStart(p, 0);
                    newRange.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(newRange);

                    // Update ingatan kursor terbaru
                    savedRange = newRange.cloneRange();
                    return;
                }
            }

            // Fallback (jika kursor sama sekali belum pernah diarahkan ke teks)
            editor.appendChild(imgContainer);
            const p = document.createElement('p');
            p.innerHTML = '<br>';
            editor.appendChild(p);
        }

        document.getElementById('note-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const dateInput = document.getElementById('note-date').value;
            const authorInput = document.getElementById('note-author').value;
            const contentHtml = document.getElementById('editor').innerHTML;
            const btnSave = document.getElementById('btn-save');

            if (!contentHtml.trim() || contentHtml === '<br>') {
                alert('Silakan tulis isi catatan terlebih dahulu.');
                return;
            }

            btnSave.disabled = true;
            btnSave.innerHTML = `
                <svg class="w-5 h-5 animate-spin stroke-current" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            `;

            try {
                const notePayload = {
                    date: dateInput || 'Catatan Tanpa Judul',
                    author: authorInput || 'Anonim',
                    coverGradient: selectedCoverGradient,
                    titleColor: selectedTitleColor,
                    content: contentHtml
                };

                if (editingId) {
                    await db.collection('love_notes').doc(editingId).update(notePayload);
                } else {
                    notePayload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection('love_notes').add(notePayload);
                }
                closeForm();
                closeReadScreen();
            } catch (err) {
                alert("Gagal menyimpan ke server: " + err.message);
            } finally {
                btnSave.disabled = false;
                btnSave.innerHTML = `
                    <svg class="w-5 h-5 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 21H7a2 2 0 01-2-2V5a2 2 0 012-2h8l4 4v12a2 2 0 01-2 2z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 3v5h8V3M7 21v-8h10v8" />
                    </svg>
                `;
            }
        });

        function filterNotes() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            
            if (!query) {
                renderGrid(globalNotes);
                return;
            }

            const filtered = globalNotes.filter(note => {
                const titleMatch = (note.date || '').toLowerCase().includes(query);
                const authorMatch = (note.author || '').toLowerCase().includes(query);
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = note.content || '';
                const plainText = (tempDiv.textContent || tempDiv.innerText || '').toLowerCase();
                return titleMatch || authorMatch || plainText.includes(query);
            });

            renderGrid(filtered, true);
        }

        function listenToNotes() {
            db.collection('love_notes').orderBy('createdAt', 'desc').onSnapshot(
                (snapshot) => {
                    globalNotes = [];
                    snapshot.forEach((doc) => {
                        globalNotes.push({ id: doc.id, ...doc.data() });
                    });
                    filterNotes();
                },
                (error) => {
                    console.error("Firestore Listen Error:", error);
                }
            );
        }

        function renderGrid(notes, isSearching = false) {
            const container = document.getElementById('notes-container');
            container.innerHTML = '';

            const addBtnHtml = `
                <div onclick="openForm()" class="aspect-square bg-white/80 rounded-2xl border border-dashed border-rose-300 flex flex-col items-center justify-center cursor-pointer hover:bg-white transition shadow-2xs group p-3">
                    <div class="w-10 h-10 bg-rose-500 rounded-full flex items-center justify-center text-white text-base shadow-2xs group-hover:scale-105 transition-transform bg-primary-btn">
                        <svg class="w-5 h-5 stroke-current" fill="none" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                    </div>
                    <p class="text-gray-700 font-semibold mt-2.5 text-xs text-center">Tambah Catatan</p>
                </div>
            `;

            if (notes.length === 0) {
                if (isSearching) {
                    container.className = "flex justify-center my-8 col-span-full";
                    container.innerHTML = `
                        <div class="text-center py-6 text-gray-400">
                            <svg class="w-8 h-8 mx-auto mb-2 stroke-current text-rose-300" fill="none" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            <p class="text-xs font-medium">Catatan tidak ditemukan...</p>
                        </div>
                    `;
                } else {
                    container.className = "flex justify-center mt-8 col-span-full";
                    container.innerHTML = `
                        <div onclick="openForm()" class="w-40 aspect-square bg-white rounded-2xl border border-dashed border-rose-300 flex flex-col items-center justify-center cursor-pointer hover:bg-rose-50 transition shadow-2xs group">
                            <div class="w-10 h-10 bg-rose-500 rounded-full flex items-center justify-center text-white shadow-2xs group-hover:scale-105 transition-transform bg-primary-btn">
                                <svg class="w-5 h-5 stroke-current" fill="none" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                            </div>
                            <p class="text-gray-700 font-semibold mt-2 text-xs">Catatan Pertama</p>
                        </div>
                    `;
                }
                return;
            }

            container.className = "grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4";
            if (!isSearching) container.innerHTML = addBtnHtml;

            notes.forEach(note => {
                const createdDate = formatCreatedDate(note.createdAt);
                const gradientBg = note.coverGradient || coverGradients[0].css;
                const titleColor = note.titleColor || titleColors[0].code;

                const card = document.createElement('div');
                card.className = `note-card aspect-square rounded-2xl shadow-sm cursor-pointer hover:scale-[1.02] transition overflow-hidden relative p-3.5 sm:p-4 flex flex-col justify-between border border-white/20 select-none`;
                card.style.background = gradientBg;
                card.onclick = () => openReadScreen(note.id);

                card.innerHTML = `
                    <div class="relative z-10 flex flex-col justify-between h-full w-full">
                        
                        <div class="flex items-center justify-between gap-1.5 w-full">
                            <span class="text-[10px] font-semibold bg-black/25 backdrop-blur-xs px-2 py-0.5 rounded-md text-white border border-white/20 truncate max-w-[78%] shrink-0">
                                 ${note.author || 'Anonim'}
                            </span>
                            
                            <button onclick="event.stopPropagation(); openForm('${note.id}')" title="Edit Sampul & Catatan" class="w-6 h-6 bg-black/20 hover:bg-black/40 backdrop-blur-md rounded-md flex items-center justify-center text-white transition active:scale-90 shrink-0">
                                <svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"/></svg>
                            </button>
                        </div>

                        <div class="my-auto py-1 w-full overflow-hidden">
                            <h3 class="cover-title font-bold font-handwriting line-clamp-3" style="color: ${titleColor} !important;">
                                ${note.date || 'Catatan Momen'}
                            </h3>
                        </div>

                        <div class="pt-1.5 border-t border-white/20 shrink-0 w-full flex items-center justify-between">
                            <span class="text-[10px] text-white font-medium flex items-center gap-1 drop-shadow-xs">
                                <svg class="w-3 h-3 stroke-current text-white/90" fill="none" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5"/></svg>
                                ${createdDate}
                            </span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openReadScreen(id) {
            const note = globalNotes.find(n => n.id === id);
            if (!note) return;

            document.getElementById('read-title').textContent = note.date || 'Catatan Momen';
            document.getElementById('read-author').textContent = `Ditulis oleh: ${note.author || 'Anonim'}`;
            document.getElementById('read-created-at').textContent = `Dibuat: ${formatCreatedDate(note.createdAt)}`;
            
            const rawContent = note.content || '';
            const readContentDiv = document.getElementById('read-content');
            readContentDiv.innerHTML = window.DOMPurify ? DOMPurify.sanitize(rawContent) : rawContent;
            
            readContentDiv.querySelectorAll('img').forEach(img => {
                img.addEventListener('click', () => openPreviewModal(img.src));
            });

            document.getElementById('btn-edit').setAttribute('onclick', `openForm('${note.id}')`);
            document.getElementById('btn-delete').setAttribute('onclick', `deleteNote('${note.id}')`);
            
            const readScreen = document.getElementById('read-screen');
            readScreen.classList.remove('hidden');
            readScreen.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeReadScreen() {
            document.getElementById('read-screen').classList.add('hidden');
            document.getElementById('read-screen').classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        function openPreviewModal(src) {
            document.getElementById('preview-modal-img').src = src;
            document.getElementById('preview-modal').classList.remove('hidden');
            document.getElementById('preview-modal').classList.add('flex');
        }

        function closePreviewModal() {
            document.getElementById('preview-modal').classList.add('hidden');
            document.getElementById('preview-modal').classList.remove('flex');
        }

        async function deleteNote(id) {
            if (confirm('Yakin ingin menghapus catatan memori ini?')) {
                try {
                    await db.collection('love_notes').doc(id).delete();
                    closeReadScreen();
                } catch (err) {
                    alert("Gagal menghapus: " + err.message);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadSavedTheme();
            listenToNotes();

            // SENSOR INGATAN KURSOR EDITOR
            const editorDiv = document.getElementById('editor');
            ['keyup', 'mouseup', 'click', 'focus', 'touchend'].forEach(evt => {
                editorDiv.addEventListener(evt, saveSelection);
            });
        });
    </script>
