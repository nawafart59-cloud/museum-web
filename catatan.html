<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Space 💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SDK Firebase CDN (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff5f7;
            color: #4a4a4a;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        [contenteditable]:empty:before {
            content: attr(placeholder);
            color: #9ca3af;
            pointer-events: none;
            display: block;
        }

        /* ==========================================
           STYLE MODE SIMPLE ELEGANT (CLEAN WHITE)
           ========================================== */
        body.theme-elegant {
            background-color: #fafafa !important;
            color: #18181b !important;
        }
        body.theme-elegant .bg-white {
            background-color: #ffffff !important;
            color: #18181b !important;
        }
        body.theme-elegant #header-card {
            background-color: rgba(255, 255, 255, 0.8) !important;
            border-color: #e4e4e7 !important;
        }
        body.theme-elegant #header-title {
            background: none !important;
            -webkit-text-fill-color: initial !important;
            color: #18181b !important;
        }
        body.theme-elegant #read-screen,
        body.theme-elegant #form-screen {
            background-color: #fafafa !important;
        }
        body.theme-elegant .border-rose-100,
        body.theme-elegant .border-rose-200,
        body.theme-elegant .border-rose-300 {
            border-color: #e4e4e7 !important;
        }
        body.theme-elegant .text-rose-800,
        body.theme-elegant .text-rose-900,
        body.theme-elegant .text-rose-700,
        body.theme-elegant .text-rose-600 {
            color: #18181b !important;
        }
        body.theme-elegant .text-rose-400 {
            color: #71717a !important;
        }
        body.theme-elegant .bg-rose-50,
        body.theme-elegant .bg-rose-50\/30,
        body.theme-elegant .bg-rose-50\/50,
        body.theme-elegant .bg-rose-50\/60 {
            background-color: #f4f4f5 !important;
        }
        body.theme-elegant .bg-rose-500 {
            background-color: #18181b !important;
            color: #ffffff !important;
            border: 1px solid #18181b !important;
        }
        body.theme-elegant .bg-rose-500:hover {
            background-color: #27272a !important;
        }
        body.theme-elegant input,
        body.theme-elegant #editor,
        body.theme-elegant #search-input {
            background-color: #ffffff !important;
            color: #18181b !important;
            border-color: #e4e4e7 !important;
        }
        body.theme-elegant #theme-btn {
            background-color: #ffffff !important;
            color: #18181b !important;
            border-color: #e4e4e7 !important;
        }
    </style>
</head>
<body class="relative overflow-x-hidden pb-12">

    <!-- HALAMAN UTAMA -->
    <div id="main-screen" class="max-w-md mx-auto px-5 pt-8 pb-20 relative z-10">
        
        <!-- BAR JUDUL / HEADER MODERN & ROMANTIS -->
        <div id="header-card" class="mb-6 p-4 rounded-2xl bg-white/60 backdrop-blur-md border border-rose-100/80 shadow-xs flex justify-between items-center transition-all">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-400 to-pink-300 flex items-center justify-center text-lg shadow-sm animate-pulse">
                    💖
                </div>
                <div>
                    <h1 id="header-title" class="text-xl font-bold bg-gradient-to-r from-rose-600 via-pink-500 to-rose-400 bg-clip-text text-transparent tracking-tight">
                        Our Love Journal
                    </h1>
                    <p class="text-rose-400 text-[11px] font-medium mt-0.5">Catatan kenangan & momen manis kita</p>
                </div>
            </div>
            
            <!-- Tombol Switch Tema -->
            <button id="theme-btn" onclick="toggleTheme()" class="px-3 py-1.5 rounded-full bg-white border border-rose-200/60 text-[11px] font-semibold text-rose-700 shadow-2xs flex items-center gap-1 hover:bg-rose-50 transition active:scale-95">
                🌸 Romantis
            </button>
        </div>

        <!-- Kolom Pencarian Catatan -->
        <div class="mb-5 relative">
            <input type="text" id="search-input" oninput="filterNotes()" placeholder="Cari kenangan atau tanggal..." class="w-full pl-10 pr-4 py-2.5 rounded-2xl border border-rose-100 shadow-xs bg-white text-xs text-gray-700 focus:outline-none focus:border-rose-300 transition">
            <span class="absolute left-3.5 top-2.5 text-sm text-rose-400 select-none">🔍</span>
        </div>

        <div id="notes-container" class="grid grid-cols-2 gap-4">
            <!-- Dimuat Realtime oleh Firebase -->
        </div>
    </div>

    <!-- LAYAR BACA FULLSCREEN -->
    <div id="read-screen" class="fixed inset-0 bg-[#fff5f7] z-50 hidden flex-col px-5 pt-6 pb-10 overflow-y-auto">
        <div class="max-w-md mx-auto w-full flex-grow flex flex-col">
            <div class="flex justify-between items-center mb-5">
                <button onclick="closeReadScreen()" class="bg-white text-rose-600 px-4 py-2 rounded-xl shadow-sm font-semibold text-xs border border-rose-100">
                    ← Kembali
                </button>
                <button id="btn-edit" class="bg-rose-500 text-white px-4 py-2 rounded-xl shadow-sm font-semibold text-xs">
                    Edit ✏️
                </button>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-rose-100 flex-grow">
                <div class="flex flex-wrap items-center gap-2 mb-4">
                    <span id="read-date" class="text-xs font-semibold text-rose-700 bg-rose-50 border border-rose-100 px-3 py-1 rounded-lg"></span>
                    <span id="read-created-at" class="text-[11px] font-medium text-gray-400 bg-gray-50 border border-gray-100 px-2.5 py-1 rounded-lg"></span>
                </div>
                
                <div id="read-content" class="text-gray-700 leading-relaxed text-sm space-y-2 mb-6"></div>
                
                <div id="read-photos-container" class="flex flex-col items-center gap-6 pt-4 border-t border-rose-100 overflow-hidden"></div>
            </div>

            <button id="btn-delete" class="mt-5 text-red-400 hover:text-red-600 font-semibold text-xs text-center w-full py-2">
                🗑️ Hapus Catatan
            </button>
        </div>
    </div>

    <!-- LAYAR FORM TAMBAH / EDIT -->
    <div id="form-screen" class="fixed inset-0 bg-[#fff5f7] z-50 hidden flex-col px-5 pt-6 pb-6 overflow-y-auto">
        <div class="max-w-md mx-auto w-full flex-grow flex flex-col relative pb-4">
            <div class="flex justify-between items-center mb-4">
                <h2 id="form-title" class="text-lg font-bold text-rose-900">✨ Tulis Catatan Baru</h2>
                <button type="button" onclick="closeForm()" class="text-gray-400 font-bold text-xl p-1">✕</button>
            </div>
            
            <form id="note-form" class="flex flex-col flex-grow gap-3 relative">
                <input type="text" id="note-date" placeholder="Judul / Momen (Cth: 14 Feb - Date Cafe)" class="w-full px-4 py-3 rounded-2xl border border-rose-100 shadow-xs bg-white focus:outline-none text-sm font-medium text-gray-700">
                
                <!-- Toolbar Format Teks -->
                <div class="flex gap-2 bg-white p-2 rounded-2xl border border-rose-100 shadow-xs items-center w-fit">
                    <button type="button" onclick="formatText('bold')" title="Tebal" class="w-8 h-8 rounded-full bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-xs flex items-center justify-center transition">B</button>
                    <button type="button" onclick="formatText('italic')" title="Miring" class="w-8 h-8 rounded-full bg-rose-50 hover:bg-rose-100 text-rose-700 italic text-xs flex items-center justify-center transition">I</button>
                    <button type="button" onclick="formatText('pink')" title="Warna Highlight" class="w-8 h-8 rounded-full bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs flex items-center justify-center transition">P</button>
                </div>

                <!-- Kolom Catatan -->
                <div class="relative flex-grow min-h-[360px] bg-white rounded-2xl border border-rose-100 shadow-xs p-4 flex flex-col gap-4 overflow-y-auto mb-2">
                    <div id="editor" contenteditable="true" placeholder="Tulis cerita manis kalian..." class="w-full min-h-[120px] focus:outline-none text-gray-700 text-sm leading-relaxed"></div>
                    
                    <div id="photo-loading-status"></div>
                    <div id="editor-photos-inline" class="flex flex-col items-center gap-6 pt-2"></div>
                </div>

                <button type="submit" id="btn-save" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-semibold py-3.5 rounded-2xl shadow-sm text-sm transition">
                    Simpan Catatan
                </button>

                <!-- Tombol Pin Foto Melayang -->
                <label for="note-image" title="Tambah Foto" class="absolute right-3 bottom-16 w-12 h-12 bg-rose-500 hover:bg-rose-600 active:scale-95 text-white rounded-full shadow-lg flex items-center justify-center cursor-pointer transition z-20">
                    <span class="text-xl leading-none select-none">📎</span>
                </label>
                <input type="file" id="note-image" accept="image/jpeg,image/png,image/webp" multiple class="hidden" onchange="handleImageUpload(event)">
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // KONFIGURASI FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyB59FGVb1ffz__-XK9mQJfAw__y9V2zz9s",
            authDomain: "lovejournal-66238.firebaseapp.com",
            projectId: "lovejournal-66238",
            storageBucket: "lovejournal-66238.firebasestorage.app",
            messagingSenderId: "658057153141",
            appId: "1:658057153141:web:17b12453a13505d85a863c"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let editingId = null;
        let uploadedPhotos = [];
        let globalNotes = [];

        // ==========================================
        // MANAJEMEN TEMA & LOCALSTORAGE
        // ==========================================
        function applyTheme(theme) {
            const btn = document.getElementById('theme-btn');
            if (theme === 'elegant') {
                document.body.classList.add('theme-elegant');
                if (btn) btn.innerHTML = '✨ Minimalist';
            } else {
                document.body.classList.remove('theme-elegant');
                if (btn) btn.innerHTML = '🌸 Romantis';
            }
        }

        function toggleTheme() {
            const currentTheme = localStorage.getItem('journal_theme') || 'romantic';
            const newTheme = currentTheme === 'romantic' ? 'elegant' : 'romantic';
            localStorage.setItem('journal_theme', newTheme);
            applyTheme(newTheme);
        }

        function loadSavedTheme() {
            const savedTheme = localStorage.getItem('journal_theme') || 'romantic';
            applyTheme(savedTheme);
        }

        function formatCreatedDate(timestamp) {
            if (!timestamp) return 'Baru saja';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleDateString('id-ID', {
                day: 'numeric',
                month: 'short',
                year: 'numeric'
            });
        }

        function formatText(command) {
            if (command === 'bold') document.execCommand('bold', false, null);
            else if (command === 'italic') document.execCommand('italic', false, null);
            else if (command === 'pink') document.execCommand('foreColor', false, '#e11d48');
            document.getElementById('editor').focus();
        }

        function openForm(id = null) {
            editingId = id;
            document.getElementById('form-screen').classList.remove('hidden');
            document.getElementById('form-screen').classList.add('flex');
            document.body.style.overflow = 'hidden';

            if (id) {
                document.getElementById('form-title').innerHTML = '✏️ Edit Catatan';
                const note = globalNotes.find(n => n.id === id);
                if (note) {
                    document.getElementById('note-date').value = note.date;
                    document.getElementById('editor').innerHTML = note.content;
                    uploadedPhotos = note.photos ? [...note.photos] : [];
                }
            } else {
                document.getElementById('form-title').innerHTML = '✨ Tulis Catatan Baru';
                document.getElementById('note-form').reset();
                document.getElementById('editor').innerHTML = '';
                uploadedPhotos = [];
            }
            renderPhotoEditor();
        }

        function closeForm() {
            document.getElementById('form-screen').classList.add('hidden');
            document.getElementById('form-screen').classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                const timer = setTimeout(() => resolve(null), 8000);

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        clearTimeout(timer);
                        try {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 350;
                            let width = img.width;
                            let height = img.height;

                            if (width > MAX_WIDTH) {
                                height = Math.round((height * MAX_WIDTH) / width);
                                width = MAX_WIDTH;
                            }

                            canvas.width = width;
                            canvas.height = height;

                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', 0.4));
                        } catch (err) {
                            resolve(null);
                        }
                    };
                    img.onerror = () => {
                        clearTimeout(timer);
                        resolve(null);
                    };
                    img.src = event.target.result;
                };
                reader.onerror = () => {
                    clearTimeout(timer);
                    resolve(null);
                };
                reader.readAsDataURL(file);
            });
        }

        async function handleImageUpload(e) {
            const files = Array.from(e.target.files);
            const statusDiv = document.getElementById('photo-loading-status');
            
            if (files.length === 0) return;

            let failedCount = 0;

            for (let i = 0; i < files.length; i++) {
                statusDiv.innerHTML = `
                    <div class="flex items-center justify-center gap-2 py-2 px-3 text-rose-600 bg-rose-50 rounded-xl border border-rose-100 my-1">
                        <svg class="animate-spin h-3.5 w-3.5 text-rose-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span class="text-xs font-semibold">Menyisipkan foto ${i + 1}/${files.length}...</span>
                    </div>
                `;

                const compressedBase64 = await compressImage(files[i]);
                if (compressedBase64) {
                    uploadedPhotos.push({
                        id: Date.now() + Math.random(),
                        src: compressedBase64,
                        scale: 100,
                        rotate: 0
                    });
                } else {
                    failedCount++;
                }
            }

            statusDiv.innerHTML = '';

            if (failedCount > 0) {
                alert(`${failedCount} foto gagal diproses.`);
            }

            renderPhotoEditor();
            e.target.value = '';
        }

        function renderPhotoEditor() {
            const container = document.getElementById('editor-photos-inline');
            container.innerHTML = '';

            if (uploadedPhotos.length === 0) return;

            uploadedPhotos.forEach((photo, index) => {
                const item = document.createElement('div');
                item.className = 'relative w-full flex flex-col items-center my-2';
                
                item.innerHTML = `
                    <div class="relative w-full max-w-[90%] rounded-2xl border border-rose-100 bg-rose-50/30 p-2.5 shadow-sm transition-all overflow-hidden">
                        <div class="flex justify-between items-center mb-2 z-10 relative">
                            <div class="flex items-center gap-1 bg-white/90 border border-rose-100 rounded-lg px-2 py-0.5 text-[10px] text-gray-600 shadow-xs">
                                <span>Urutan:</span>
                                ${index > 0 ? `<button type="button" onclick="movePhoto(${index}, -1)" class="text-rose-600 font-bold px-1 hover:bg-rose-50 rounded">▲</button>` : ''}
                                ${index < uploadedPhotos.length - 1 ? `<button type="button" onclick="movePhoto(${index}, 1)" class="text-rose-600 font-bold px-1 hover:bg-rose-50 rounded">▼</button>` : ''}
                            </div>
                            
                            <button type="button" onclick="removePhoto(${index})" class="bg-red-500 hover:bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] font-bold shadow-xs">✕</button>
                        </div>

                        <div class="w-full flex justify-center items-center overflow-hidden py-1">
                            <img src="${photo.src}" style="transform: rotate(${photo.rotate}deg) scale(${photo.scale / 100}); max-height: 260px;" class="w-auto max-w-full rounded-xl object-contain transition-transform">
                        </div>

                        <div class="mt-2 pt-2 border-t border-rose-100/80 flex flex-col gap-1.5 px-1 bg-white/80 rounded-xl p-2">
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-semibold text-rose-800 w-12">Ukuran:</span>
                                <input type="range" min="40" max="100" value="${photo.scale}" oninput="updatePhotoProp(${index}, 'scale', this.value)" class="w-full accent-rose-500 h-1">
                                <span class="text-[10px] text-gray-500 w-7 text-right">${photo.scale}%</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-semibold text-rose-800 w-12">Rotasi:</span>
                                <input type="range" min="-45" max="45" value="${photo.rotate}" oninput="updatePhotoProp(${index}, 'rotate', this.value)" class="w-full accent-rose-500 h-1">
                                <span class="text-[10px] text-gray-500 w-7 text-right">${photo.rotate}°</span>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function movePhoto(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= uploadedPhotos.length) return;
            const temp = uploadedPhotos[index];
            uploadedPhotos[index] = uploadedPhotos[newIndex];
            uploadedPhotos[newIndex] = temp;
            renderPhotoEditor();
        }

        function updatePhotoProp(index, prop, value) {
            uploadedPhotos[index][prop] = parseInt(value);
            renderPhotoEditor();
        }

        function removePhoto(index) {
            uploadedPhotos.splice(index, 1);
            renderPhotoEditor();
        }

        document.getElementById('note-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const dateInput = document.getElementById('note-date').value;
            const contentHtml = document.getElementById('editor').innerHTML;
            const btnSave = document.getElementById('btn-save');

            if (!contentHtml.trim() || contentHtml === '<br>') {
                alert('Tulisannya jangan kosong ya! 😊');
                return;
            }

            btnSave.disabled = true;
            btnSave.innerHTML = "Menyimpan... ⏳";

            try {
                if (editingId) {
                    await db.collection('love_notes').doc(editingId).update({
                        date: dateInput || 'Catatan Spesial ✨',
                        content: contentHtml,
                        photos: uploadedPhotos
                    });
                } else {
                    await db.collection('love_notes').add({
                        date: dateInput || 'Catatan Spesial ✨',
                        content: contentHtml,
                        photos: uploadedPhotos,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                closeForm();
                closeReadScreen();
            } catch (err) {
                alert("Gagal menyimpan ke cloud: " + err.message);
            } finally {
                btnSave.disabled = false;
                btnSave.innerHTML = "Simpan Catatan";
            }
        });

        function filterNotes() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            
            if (!query) {
                renderGrid(globalNotes);
                return;
            }

            const filtered = globalNotes.filter(note => {
                const titleMatch = (note.date || '').toLowerCase().includes(query);
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = note.content || '';
                const plainText = (tempDiv.textContent || tempDiv.innerText || '').toLowerCase();
                const contentMatch = plainText.includes(query);

                return titleMatch || contentMatch;
            });

            renderGrid(filtered, true);
        }

        function listenToNotes() {
            db.collection('love_notes').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
                globalNotes = [];
                snapshot.forEach((doc) => {
                    globalNotes.push({ id: doc.id, ...doc.data() });
                });
                filterNotes();
            });
        }

        function renderGrid(notes, isSearching = false) {
            const container = document.getElementById('notes-container');
            container.innerHTML = '';

            const addBtnHtml = `
                <div onclick="openForm()" class="aspect-square bg-white/70 rounded-2xl border border-dashed border-rose-300 flex flex-col items-center justify-center cursor-pointer hover:bg-white transition shadow-sm group">
                    <div class="w-9 h-9 bg-rose-500 rounded-full flex items-center justify-center text-white text-xl font-bold shadow-sm group-hover:scale-105 transition-transform">+</div>
                    <p class="text-rose-700 font-semibold mt-2 text-xs">Tambah</p>
                </div>
            `;

            if (notes.length === 0) {
                if (isSearching) {
                    container.className = "flex justify-center my-6 col-span-2";
                    container.innerHTML = `
                        <div class="text-center py-6 text-gray-400">
                            <p class="text-2xl mb-1">🔍</p>
                            <p class="text-xs font-medium">Catatan tidak ditemukan...</p>
                        </div>
                    `;
                } else {
                    container.className = "flex justify-center mt-8";
                    container.innerHTML = `
                        <div onclick="openForm()" class="w-40 aspect-square bg-white rounded-2xl border border-dashed border-rose-300 flex flex-col items-center justify-center cursor-pointer hover:bg-rose-50 transition shadow-sm group">
                            <div class="w-11 h-11 bg-rose-500 rounded-full flex items-center justify-center text-white text-2xl font-bold shadow-sm group-hover:scale-105 transition-transform">+</div>
                            <p class="text-rose-800 font-semibold mt-2.5 text-xs">Catatan Pertama</p>
                        </div>
                    `;
                }
                return;
            }

            container.className = "grid grid-cols-2 gap-3.5";
            if (!isSearching) container.innerHTML = addBtnHtml;

            notes.forEach(note => {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = note.content;
                let plainText = tempDiv.textContent || tempDiv.innerText || '';
                if (plainText.length > 25) plainText = plainText.substring(0, 25) + '...';

                const createdDate = formatCreatedDate(note.createdAt);
                const firstPhoto = (note.photos && note.photos.length > 0) ? note.photos[0].src : null;

                let bgStyle = '';
                let textClass = 'text-gray-700';
                let dateBadge = 'text-rose-700 bg-rose-50 border border-rose-100';
                let overlay = '';

                if (firstPhoto) {
                    bgStyle = `background-image: url('${firstPhoto}'); background-size: cover; background-position: center;`;
                    textClass = 'text-white drop-shadow';
                    dateBadge = 'text-white bg-black/40 backdrop-blur-sm border border-white/20';
                    overlay = '<div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent z-0"></div>';
                }

                const card = document.createElement('div');
                card.className = `aspect-square rounded-2xl shadow-sm cursor-pointer hover:scale-[1.01] transition overflow-hidden relative p-3.5 flex flex-col justify-between bg-white border border-rose-100`;
                card.style = bgStyle;
                card.onclick = () => openReadScreen(note.id);

                card.innerHTML = `
                    ${overlay}
                    <div class="relative z-10 flex justify-between items-start">
                        <span class="text-[9px] font-semibold px-2 py-0.5 rounded-md ${dateBadge} truncate max-w-[85%]">${note.date}</span>
                    </div>
                    <div class="relative z-10">
                        <p class="text-xs font-semibold leading-snug ${textClass} mb-1">${plainText}</p>
                        <p class="text-[9px] ${firstPhoto ? 'text-gray-200' : 'text-gray-400'} font-medium">${createdDate}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openReadScreen(id) {
            const note = globalNotes.find(n => n.id === id);
            if (!note) return;

            document.getElementById('read-date').textContent = note.date;
            document.getElementById('read-created-at').textContent = `Dibuat: ${formatCreatedDate(note.createdAt)}`;
            document.getElementById('read-content').innerHTML = note.content;
            
            const photosContainer = document.getElementById('read-photos-container');
            photosContainer.innerHTML = '';

            const photosList = note.photos || [];

            if (photosList.length > 0) {
                photosContainer.classList.remove('hidden');
                photosList.forEach(p => {
                    const imgWrapper = document.createElement('div');
                    imgWrapper.className = 'w-full flex justify-center py-2 overflow-hidden';
                    imgWrapper.innerHTML = `
                        <div class="bg-white p-2 pb-3 rounded-xl shadow-sm border border-rose-100 flex justify-center items-center transition-transform" 
                             style="transform: rotate(${p.rotate || 0}deg); width: ${p.scale || 100}%; max-width: 100%;">
                            <img src="${p.src}" class="w-full h-auto rounded-lg object-cover max-h-80 shadow-xs">
                        </div>
                    `;
                    photosContainer.appendChild(imgWrapper);
                });
            } else {
                photosContainer.classList.add('hidden');
            }

            document.getElementById('btn-edit').setAttribute('onclick', `openForm('${note.id}')`);
            document.getElementById('btn-delete').setAttribute('onclick', `deleteNote('${note.id}')`);
            
            const readScreen = document.getElementById('read-screen');
            readScreen.classList.remove('hidden');
            readScreen.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeReadScreen() {
            document.getElementById('read-screen').classList.add('hidden');
            document.getElementById('read-screen').classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        async function deleteNote(id) {
            if (confirm('Yakin mau hapus memori ini? 🥺')) {
                try {
                    await db.collection('love_notes').doc(id).delete();
                    closeReadScreen();
                } catch (err) {
                    alert("Gagal menghapus: " + err.message);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadSavedTheme();
            listenToNotes();
        });
    </script>
</body>
</html>
